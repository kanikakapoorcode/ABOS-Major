[tool.poetry]
name = "abos"
version = "0.1.0"
description = "Adaptive Business Operating System — Multi-Agent Framework for Goal-Driven Business Workflow Automation"
authors = [
    "Kanika Kapoor <2318936>",
    "Ashmit Bhandari <2318551>",
    "Kaushal Thakur <2318971>",
    "Harshit Gahlot <2318837>",
]
readme = "README.md"
packages = [{ include = "backend" }]

[tool.poetry.dependencies]
python = "^3.12"

# Web framework
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
python-multipart = "^0.0.12"

# LangGraph + LLM
langgraph = "^0.2.0"
langchain = "^0.3.0"
langchain-core = "^0.3.0"
litellm = "^1.50.0"

# Data validation
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"

# Database
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
asyncpg = "^0.30.0"
alembic = "^1.14.0"
pgvector = "^0.3.5"
psycopg2-binary = "^2.9.10"

# Task queue
celery = { extras = ["redis"], version = "^5.4.0" }
redis = "^5.2.0"

# Auth
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }

# Evaluation / analysis
pandas = "^2.2.0"
numpy = "^2.0.0"
scipy = "^1.14.0"
mlflow = "^2.18.0"

# Utilities
python-dotenv = "^1.0.1"
httpx = "^0.28.0"
tenacity = "^9.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.0"
factory-boy = "^3.3.1"
ruff = "^0.8.0"
mypy = "^1.13.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env = ["APP_ENV=test"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
